services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web

  web:
    build: .
    command: sh -c "python manage.py migrate && python seed.py && python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_started
      llm-init:
        condition: service_completed_successfully
    environment:
      - POSTGRES_DB=acubot_db
      - POSTGRES_USER=acubot_user
      - POSTGRES_PASSWORD=supergizlisifre
      - POSTGRES_HOST=db

  db:
    image: postgres:15-alpine 
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=acubot_db
      - POSTGRES_USER=acubot_user
      - POSTGRES_PASSWORD=supergizlisifre
    ports:
      - "5432:5432"

  llm:
    image: ollama/ollama  
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  llm-init:
    image: ollama/ollama
    restart: "no"
    depends_on:
      - llm
    environment:
      - OLLAMA_HOST=http://llm:11434
    command: pull qwen2.5:3b

volumes:
  postgres_data:
  ollama_data: