services:
  nginx:
    image: nginx:alpine
    container_name: acubot_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web

  web:
    build: .
    container_name: acubot_web
    restart: unless-stopped
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      llm-init:
        condition: service_completed_successfully
    environment:
      DJANGO_DEBUG: ${DJANGO_DEBUG:-1}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-django-insecure-dev-only}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-*}
      POSTGRES_DB: ${POSTGRES_DB:-acubot_db}
      POSTGRES_USER: ${POSTGRES_USER:-acubot_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-supergizlisifre}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      OLLAMA_URL: http://llm:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:3b}
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-1h}
      DJANGO_SUPERUSER_USERNAME: ${DJANGO_SUPERUSER_USERNAME:-admin}
      DJANGO_SUPERUSER_PASSWORD: ${DJANGO_SUPERUSER_PASSWORD:-admin}
      DJANGO_SUPERUSER_EMAIL: ${DJANGO_SUPERUSER_EMAIL:-admin@example.com}

  db:
    image: postgres:15-alpine
    container_name: acubot_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-acubot_db}
      POSTGRES_USER: ${POSTGRES_USER:-acubot_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-supergizlisifre}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-acubot_user} -d ${POSTGRES_DB:-acubot_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  llm:
    image: ollama/ollama
    container_name: acubot_llm
    restart: unless-stopped
    dns:
      - 1.1.1.1
      - 8.8.8.8
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  llm-init:
    image: ollama/ollama
    container_name: acubot_llm_init
    restart: "no"
    depends_on:
      - llm
    environment:
      OLLAMA_HOST: http://llm:11434
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until ollama list >/dev/null 2>&1; do
            echo "[llm-init] waiting for ollama server..."
            sleep 2
        done
        MODEL="${OLLAMA_MODEL:-llama3.2:3b}"
        if ollama list | awk 'NR>1{print $$1}' | grep -Fxq "$$MODEL"; then
            echo "[llm-init] model $$MODEL already cached, skipping pull"
        else
            echo "[llm-init] pulling $$MODEL"
            ollama pull "$$MODEL"
        fi

volumes:
  postgres_data:
  ollama_data:
