<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ACUBOT</title>
  <style>
    :root {
      --bg: #0f1419;
      --surface: #1a2332;
      --border: #2d3a4f;
      --text: #e8edf4;
      --muted: #8b9cb3;
      --accent: #3d8bfd;
      --user-bg: #243447;
      --bot-bg: #1e2d22;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      overscroll-behavior: none;
    }
    .container {
      display: flex;
      height: 100vh;
      gap: 1px;
      background: var(--border);
    }

    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: var(--bg);
    }
    .header {
      padding: 1.5rem;
      border-bottom: 1px solid var(--border);
    }
    .header h1 {
      margin: 0 0 0.25rem;
      font-size: 1.35rem;
      font-weight: 600;
      letter-spacing: -0.02em;
    }
    .header p {
      margin: 0;
      font-size: 0.9rem;
      color: var(--muted);
    }
    .messages-container {
      flex: 1;
      overflow-y: auto;
      padding: 1.5rem 1rem 1.5rem;
      max-width: 800px;
      margin: 0 auto;
      width: 100%;
      min-height: 0;
      overscroll-behavior-y: contain;
    }
    .empty-state {
      color: var(--muted);
      font-size: 0.9rem;
      text-align: center;
      padding: 2rem 1rem;
    }
    .message {
      display: flex;
      margin-bottom: 1rem;
    }
    .message.user {
      justify-content: flex-end;
    }
    .bubble {
      max-width: 70%;
      padding: 0.75rem 1rem;
      border-radius: 12px;
      border: 1px solid var(--border);
      font-size: 0.95rem;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .bubble.user {
      background: var(--user-bg);
    }
    .bubble.assistant {
      background: var(--bot-bg);
    }
    .composer {
      padding: 1rem;
      background: var(--bg);
      border-top: 1px solid var(--border);
    }
    form.compose {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      max-width: 800px;
      margin: 0 auto;
      width: 100%;
    }
    textarea {
      width: 100%;
      min-height: 4.5rem;
      resize: vertical;
      padding: 0.75rem 1rem;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-family: inherit;
      font-size: 0.95rem;
    }
    textarea:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(61, 139, 253, 0.25);
    }
    .actions {
      display: flex;
      gap: 0.5rem;
    }
    button[type="submit"] {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 0.55rem 1.15rem;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
    }
    button[type="submit"]:hover:not(:disabled) {
      filter: brightness(1.08);
    }
    button[type="submit"]:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .error {
      background: #f8d7da;
      border: 1px solid #f5c6cb;
      color: #721c24;
      padding: 15px;
      border-radius: 8px;
      font-size: 0.9rem;
      margin: 10px 0;
      display: flex;
      align-items: center;
    }
    .error::before {
        content: "⚠️ ";
        margin-right: 5px;
    }
    .loading {
      color: var(--muted);
      font-style: italic;
    }
    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
  </style>
</head>
<body>
  <div class="container">

    <div class="main-content">
      <div class="header">
        <h1>ACUBOT</h1>
        <p>Ask about Acibadem University. Answers use the assistant pipeline.</p>
      </div>
      <div class="messages-container" id="messagesContainer"></div>
      <div class="composer">
        <form class="compose" onsubmit="sendMessage(event)">
          <label for="message" class="visually-hidden">Your Question</label>
          <textarea id="message" placeholder="e.g., What courses are there in the Computer Engineering department?" rows="3" autofocus></textarea>
          <div class="actions">
            <button type="submit">Send</button>
          </div>
        </form>
      </div>
    </div>
  </div>
  <script>
    let chatHistory = [];
    const apiBaseUrl = '/api/chat';

    function getCookie(n){let v=null;if(document.cookie&&document.cookie!==''){document.cookie.split(';').forEach(c=>{c=c.trim();if(c.substring(0,n.length+1)===(n+'=')){v=decodeURIComponent(c.substring(n.length+1));}});}return v;}
    const csrfToken = document.querySelector('[name=csrfmiddlewaretoken]')?.value || getCookie('csrftoken');

    async function sendMessage(e){
      e.preventDefault();
      const c = document.getElementById('messagesContainer');
      const b = e.target.querySelector('button[type="submit"]');
      const t = document.getElementById('message');
      const m = t.value.trim();
      
      if(!m) return;
      t.value = '';
      b.disabled = true;
      if(c.innerHTML.includes('empty-state')){c.innerHTML='';}
      
      const u = document.createElement('div');
      u.className = 'message user';
      const ub = document.createElement('div');
      ub.className = 'bubble user';
      ub.textContent = m;
      u.appendChild(ub);
      c.appendChild(u);
      c.scrollTop = c.scrollHeight;
      
      const l = document.createElement('div');
      l.className = 'message';
      l.innerHTML = '<p class="loading">ACUBOT is thinking...</p>';
      c.appendChild(l);
      c.scrollTop = c.scrollHeight;

      try{
        const h = {'Content-Type':'application/json'};
        if(csrfToken) h['X-CSRFToken'] = csrfToken;
        
        const payload = { message: m, history: chatHistory };
        
        const r = await fetch(`${apiBaseUrl}/ask/`, {
          method: 'POST',
          headers: h,
          body: JSON.stringify(payload)
        });

        if(!r||!r.ok){
          throw new Error('Network response was not ok');
        }
        
        const data = await r.json();
        const botResponse = data.response;
        
        l.className = 'message assistant';
        l.innerHTML = '';
        const lb = document.createElement('div');
        lb.className = 'bubble assistant';
        lb.textContent = botResponse;
        l.appendChild(lb);
        c.scrollTop = c.scrollHeight;
        
        chatHistory.push({ role: 'user', text: m });
        chatHistory.push({ role: 'assistant', text: botResponse });
        
        if (chatHistory.length > 50) {
            chatHistory = chatHistory.slice(-50);
        }

      }catch(er){
        console.error('Error:',er);
        l.remove();
        const ed=document.createElement('div');
        ed.className='error';
        ed.textContent='Error: '+er.message;
        c.appendChild(ed);
      }
      b.disabled=false;
    }
    
    document.addEventListener('DOMContentLoaded',()=>{
      const textarea = document.getElementById('message');
      textarea.addEventListener('keydown', function(e) {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          document.querySelector('form.compose').dispatchEvent(new Event('submit', {cancelable: true, bubbles: true}));
        }
      });
    });
  </script>
</body>
</html>
