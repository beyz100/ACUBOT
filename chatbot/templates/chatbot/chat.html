<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ACUBOT</title>
  <style>
    :root {
      --bg: #0f1419;
      --surface: #1a2332;
      --border: #2d3a4f;
      --text: #e8edf4;
      --muted: #8b9cb3;
      --accent: #3d8bfd;
      --user-bg: #243447;
      --bot-bg: #1e2d22;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }
    .container {
      display: flex;
      height: 100vh;
      gap: 1px;
      background: var(--border);
    }
    .sidebar {
      width: 280px;
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
    }
    .sidebar-header {
      padding: 1rem;
      border-bottom: 1px solid var(--border);
    }
    .sidebar-header button {
      width: 100%;
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 0.55rem 1rem;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.9rem;
    }
    .sidebar-header button:hover {
      filter: brightness(1.08);
    }
    .sidebar-title {
      padding: 1rem 1rem 0.25rem 1rem;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .conversations-list {
      flex: 1;
      overflow-y: auto;
      padding: 0.5rem;
    }
    .conversation-item {
      padding: 0.75rem;
      margin-bottom: 0.25rem;
      border-radius: 6px;
      cursor: pointer;
      border: 1px solid transparent;
      font-size: 0.9rem;
      transition: all 0.2s;
    }
    .conversation-item:hover {
      background: var(--bg);
      border-color: var(--border);
    }
    .conversation-item.active {
      background: var(--accent);
      border-color: var(--accent);
      font-weight: 600;
    }
    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: var(--bg);
    }
    .header {
      padding: 1.5rem;
      border-bottom: 1px solid var(--border);
    }
    .header h1 {
      margin: 0 0 0.25rem;
      font-size: 1.35rem;
      font-weight: 600;
      letter-spacing: -0.02em;
    }
    .header p {
      margin: 0;
      font-size: 0.9rem;
      color: var(--muted);
    }
    .messages-container {
      flex: 1;
      overflow-y: auto;
      padding: 1.5rem 1rem 4rem;
      max-width: 800px;
      margin: 0 auto;
      width: 100%;
    }
    .empty-state {
      color: var(--muted);
      font-size: 0.9rem;
      text-align: center;
      padding: 2rem 1rem;
    }
    .message {
      display: flex;
      margin-bottom: 1rem;
    }
    .message.user {
      justify-content: flex-end;
    }
    .bubble {
      max-width: 70%;
      padding: 0.75rem 1rem;
      border-radius: 12px;
      border: 1px solid var(--border);
      font-size: 0.95rem;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .bubble.user {
      background: var(--user-bg);
    }
    .bubble.assistant {
      background: var(--bot-bg);
    }
    .composer {
      position: fixed;
      bottom: 0;
      right: 0;
      left: 280px;
      padding: 1rem;
      background: linear-gradient(to top, var(--bg) 70%, transparent);
      border-top: 1px solid var(--border);
    }
    form.compose {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      max-width: 800px;
      margin: 0 auto;
      width: 100%;
    }
    textarea {
      width: 100%;
      min-height: 4.5rem;
      resize: vertical;
      padding: 0.75rem 1rem;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-family: inherit;
      font-size: 0.95rem;
    }
    textarea:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(61, 139, 253, 0.25);
    }
    .actions {
      display: flex;
      gap: 0.5rem;
    }
    button[type="submit"] {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 0.55rem 1.15rem;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
    }
    button[type="submit"]:hover:not(:disabled) {
      filter: brightness(1.08);
    }
    button[type="submit"]:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .error {
      background: #3d1f24;
      border: 1px solid #6b2d36;
      color: #f5c6cb;
      padding: 0.65rem 0.85rem;
      border-radius: 8px;
      font-size: 0.9rem;
    }
    .loading {
      color: var(--muted);
      font-style: italic;
    }
    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="sidebar">
      <div class="sidebar-header">
        <button onclick="createNewConversation()">+ Yeni Sohbet</button>
      </div>
      <div class="sidebar-title">Eski Sohbetler</div>
      <div class="conversations-list" id="conversationsList"></div>
    </div>
    <div class="main-content">
      <div class="header">
        <h1>ACUBOT</h1>
        <p>Ask about Acibadem University. Answers use the assistant pipeline.</p>
      </div>
      <div class="messages-container" id="messagesContainer"></div>
      <div class="composer">
        <form class="compose" onsubmit="sendMessage(event)">
          <label for="message" class="visually-hidden">Sorunuz</label>
          <textarea id="message" placeholder="Örn. Bilgisayar Mühendisliği bölümünde hangi dersler var?" rows="3" autofocus></textarea>
          <div class="actions">
            <button type="submit">Gönder</button>
          </div>
        </form>
      </div>
    </div>
  </div>
  <script>
    let currentConversationId=null;
    const apiBaseUrl='/api/chat';
    function getCookie(n){let v=null;if(document.cookie&&document.cookie!==''){document.cookie.split(';').forEach(c=>{c=c.trim();if(c.substring(0,n.length+1)===(n+'=')){v=decodeURIComponent(c.substring(n.length+1));}});}return v;}
    const csrfToken=document.querySelector('[name=csrfmiddlewaretoken]')?.value||getCookie('csrftoken');
    async function fetchWithAuth(u,o={}){const h={'Content-Type':'application/json',...(o.headers||{})};if(csrfToken&&o.method&&o.method!=='GET'){h['X-CSRFToken']=csrfToken;}const r=await fetch(u,{...o,headers:h});if(r.status===401||r.status===403){window.location.href='/admin/login/?next=/chat/';}return r;}
    async function loadConversations(){const r=await fetchWithAuth(`${apiBaseUrl}/conversations/`);if(!r||!r.ok)return;const c=await r.json();const l=document.getElementById('conversationsList');l.innerHTML='';c.forEach(v=>{const i=document.createElement('div');i.className=`conversation-item ${v.id===currentConversationId?'active':''}`;i.textContent=v.title||`Sohbet ${v.id}`;i.onclick=()=>selectConversation(v.id);l.appendChild(i);});if(c.length===0&&currentConversationId===null){createNewConversation();}}
    async function createNewConversation(){const r=await fetchWithAuth(`${apiBaseUrl}/conversations/`,{method:'POST',body:JSON.stringify({title:`Sohbet ${new Date().toLocaleDateString()}`})});if(!r||!r.ok)return;const v=await r.json();selectConversation(v.id);await loadConversations();}
    async function selectConversation(i){currentConversationId=i;document.getElementById('message').value='';await loadMessages();await loadConversations();}
    async function loadMessages(){if(!currentConversationId)return;const r=await fetchWithAuth(`${apiBaseUrl}/conversations/${currentConversationId}/messages/`);if(!r||!r.ok)return;const m=await r.json();const c=document.getElementById('messagesContainer');c.innerHTML='';if(m.length===0){c.innerHTML='<p class="empty-state">Henüz mesaj yok.</p>';return;}m.forEach(v=>{const d=document.createElement('div');d.className=`message ${v.role}`;const b=document.createElement('div');b.className=`bubble ${v.role}`;b.textContent=v.content;d.appendChild(b);c.appendChild(d);});c.scrollTop=c.scrollHeight;}
    async function sendMessage(e){e.preventDefault();const c=document.getElementById('messagesContainer');const b=e.target.querySelector('button[type="submit"]');if(!currentConversationId){await createNewConversation();if(!currentConversationId){const ed=document.createElement('div');ed.className='error';ed.textContent='Sohbet başlatılamadı. Lütfen giriş yaptığınızdan emin olun.';c.appendChild(ed);b.disabled=false;return;}}const t=document.getElementById('message');const m=t.value.trim();if(!m)return;t.value='';b.disabled=true;if(c.innerHTML.includes('empty-state')){c.innerHTML='';}const u=document.createElement('div');u.className='message user';const ub=document.createElement('div');ub.className='bubble user';ub.textContent=m;u.appendChild(ub);c.appendChild(u);c.scrollTop=c.scrollHeight;const l=document.createElement('div');l.className='message';l.innerHTML='<p class="loading">ACUBOT düşünüyor...</p>';c.appendChild(l);c.scrollTop=c.scrollHeight;try{const r=await fetchWithAuth(`${apiBaseUrl}/conversations/${currentConversationId}/send/`,{method:'POST',body:JSON.stringify({message:m})});if(!r||!r.ok){l.remove();const ed=document.createElement('div');ed.className='error';ed.textContent='Mesaj gönderilemedi.';c.appendChild(ed);b.disabled=false;return;}await loadMessages();}catch(er){console.error('Error:',er);l.remove();const ed=document.createElement('div');ed.className='error';ed.textContent='Hata: '+er.message;c.appendChild(ed);}b.disabled=false;}
    document.addEventListener('DOMContentLoaded',()=>{loadConversations();setInterval(loadConversations,30000);});
  </script>
</body>
</html>
