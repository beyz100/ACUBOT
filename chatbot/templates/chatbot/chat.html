<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ACUBOT</title>
  <style>
    :root {
      --bg: #0f1419;
      --surface: #1a2332;
      --border: #2d3a4f;
      --text: #e8edf4;
      --muted: #8b9cb3;
      --accent: #3d8bfd;
      --user-bg: #243447;
      --bot-bg: #1e2d22;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      overscroll-behavior: none;
    }
    .container {
      display: flex;
      height: 100vh;
      gap: 1px;
      background: var(--border);
    }

    .sidebar {
      width: 280px;
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .sidebar-header {
      padding: 1rem;
      border-bottom: 1px solid var(--border);
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text);
    }

    .sidebar-content {
      flex: 1;
      overflow-y: auto;
      padding: 0.5rem;
    }

    .conversation-item {
      padding: 0.75rem;
      margin-bottom: 0.5rem;
      border-radius: 8px;
      border: 1px solid transparent;
      background: var(--bg);
      cursor: pointer;
      transition: all 0.2s ease;
      border: 1px solid var(--border);
    }

    .conversation-item:hover {
      background: var(--border);
      border-color: var(--accent);
    }

    .conversation-item.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    .conversation-item .timestamp {
      font-size: 0.75rem;
      color: var(--muted);
      margin-bottom: 0.25rem;
    }

    .conversation-item.active .timestamp {
      color: rgba(255, 255, 255, 0.7);
    }

    .conversation-item .preview {
      font-size: 0.85rem;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      line-height: 1.3;
    }

    .sidebar-actions {
      padding: 0.75rem;
      border-top: 1px solid var(--border);
    }

    .btn-new-chat {
      width: 100%;
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 0.5rem;
      border-radius: 6px;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      transition: filter 0.2s ease;
    }

    .btn-new-chat:hover {
      filter: brightness(1.08);
    }

    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: var(--bg);
    }
    .header {
      padding: 1.5rem;
      border-bottom: 1px solid var(--border);
    }
    .header h1 {
      margin: 0 0 0.25rem;
      font-size: 1.35rem;
      font-weight: 600;
      letter-spacing: -0.02em;
    }
    .header p {
      margin: 0;
      font-size: 0.9rem;
      color: var(--muted);
    }
    .messages-container {
      flex: 1;
      overflow-y: auto;
      padding: 1.5rem 1rem 1.5rem;
      max-width: 800px;
      margin: 0 auto;
      width: 100%;
      min-height: 0;
      overscroll-behavior-y: contain;
    }
    .empty-state {
      color: var(--muted);
      font-size: 0.9rem;
      text-align: center;
      padding: 2rem 1rem;
    }
    .message {
      display: flex;
      margin-bottom: 1rem;
    }
    .message.user {
      justify-content: flex-end;
    }
    .bubble {
      max-width: 70%;
      padding: 0.75rem 1rem;
      border-radius: 12px;
      border: 1px solid var(--border);
      font-size: 0.95rem;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .bubble.user {
      background: var(--user-bg);
    }
    .bubble.assistant {
      background: var(--bot-bg);
    }
    .composer {
      padding: 1rem;
      background: var(--bg);
      border-top: 1px solid var(--border);
    }
    form.compose {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      max-width: 800px;
      margin: 0 auto;
      width: 100%;
    }
    textarea {
      width: 100%;
      min-height: 4.5rem;
      resize: vertical;
      padding: 0.75rem 1rem;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-family: inherit;
      font-size: 0.95rem;
    }
    textarea:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(61, 139, 253, 0.25);
    }
    .actions {
      display: flex;
      gap: 0.5rem;
    }
    button[type="submit"] {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 0.55rem 1.15rem;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
    }
    button[type="submit"]:hover:not(:disabled) {
      filter: brightness(1.08);
    }
    button[type="submit"]:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .error {
      background: #f8d7da;
      border: 1px solid #f5c6cb;
      color: #721c24;
      padding: 15px;
      border-radius: 8px;
      font-size: 0.9rem;
      margin: 10px 0;
      display: flex;
      align-items: center;
    }
    .error::before {
        content: "⚠️ ";
        margin-right: 5px;
    }
    .loading {
      color: var(--muted);
      font-style: italic;
    }
    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
  </style>
</head>
<body>
  <div class="container">

    <div class="sidebar">
      <div class="sidebar-header">Chat History</div>
      <div class="sidebar-content" id="conversationsList">
        <p style="color: var(--muted); font-size: 0.85rem; padding: 1rem; text-align: center;">
          No conversations yet.
        </p>
      </div>
      <div class="sidebar-actions">
        <button class="btn-new-chat" onclick="startNewChat()">+ New Chat</button>
      </div>
    </div>

    <div class="main-content">
      <div class="header">
        <h1>ACUBOT</h1>
        <p>Hello! Ask about Acibadem University.</p>
      </div>
      <div class="messages-container" id="messagesContainer"></div>
      <div class="composer">
        <form class="compose" onsubmit="sendMessage(event)">
          <label for="message" class="visually-hidden">Your Question</label>
          <textarea id="message" placeholder="e.g., What courses are there in the Computer Engineering department?" rows="3" autofocus></textarea>
          <div class="actions">
            <button type="submit">Send</button>
          </div>
        </form>
      </div>
    </div>
  </div>
  <script>
    let chatHistory = [];
    let currentConversationId = null;
    let isNewConversation = false;
    const apiBaseUrl = '/api/chat';

    function getCookie(n){let v=null;if(document.cookie&&document.cookie!==''){document.cookie.split(';').forEach(c=>{c=c.trim();if(c.substring(0,n.length+1)===(n+'=')){v=decodeURIComponent(c.substring(n.length+1));}});}return v;}
    const csrfToken = document.querySelector('[name=csrfmiddlewaretoken]')?.value || getCookie('csrftoken');

    function formatDate(dateStr) {
      const date = new Date(dateStr);
      const now = new Date();
      const diffMs = now - date;
      const diffMins = Math.floor(diffMs / 60000);
      const diffHours = Math.floor(diffMs / 3600000);
      const diffDays = Math.floor(diffMs / 86400000);

      if (diffMins < 1) return 'Just now';
      if (diffMins < 60) return diffMins + 'm ago';
      if (diffHours < 24) return diffHours + 'h ago';
      if (diffDays < 7) return diffDays + 'd ago';

      return date.toLocaleDateString();
    }

    async function loadConversations() {
      try {
        const r = await fetch(`${apiBaseUrl}/conversations/`, { credentials: 'same-origin' });
        if (!r || !r.ok) throw new Error('Failed to load conversations');

        const conversations = await r.json();
        const container = document.getElementById('conversationsList');

        if (conversations.length === 0) {
          container.innerHTML = '<p style="color: var(--muted); font-size: 0.85rem; padding: 1rem; text-align: center;">No conversations yet.</p>';
          return;
        }

        container.innerHTML = conversations.map(conv => `
          <div class="conversation-item ${currentConversationId === conv.id ? 'active' : ''}" onclick="loadConversation(${conv.id})">
            <div class="timestamp">${formatDate(conv.updated_at)}</div>
            <div class="preview">${conv.first_message || 'Empty conversation'}</div>
          </div>
        `).join('');
      } catch (err) {
        console.error('Error loading conversations:', err);
      }
    }

    async function loadConversation(conversationId) {
      try {
        const r = await fetch(`${apiBaseUrl}/conversations/${conversationId}/`, { credentials: 'same-origin' });
        if (!r || !r.ok) throw new Error('Failed to load conversation');

        const conversation = await r.json();
        currentConversationId = conversationId;
        isNewConversation = false;

        const container = document.getElementById('messagesContainer');
        container.innerHTML = '';

        chatHistory = [];

        conversation.messages.forEach(msg => {
          const msgDiv = document.createElement('div');
          msgDiv.className = `message ${msg.role}`;
          const bubble = document.createElement('div');
          bubble.className = `bubble ${msg.role}`;
          bubble.textContent = msg.text;
          msgDiv.appendChild(bubble);
          container.appendChild(msgDiv);

          chatHistory.push({ role: msg.role, text: msg.text });
        });

        container.scrollTop = container.scrollHeight;

        document.querySelectorAll('.conversation-item').forEach(item => {
          item.classList.remove('active');
          const handler = item.getAttribute('onclick') || '';
          if (handler.includes('loadConversation(' + conversationId + ')')) {
            item.classList.add('active');
          }
        });

        loadConversations();
      } catch (err) {
        console.error('Error loading conversation:', err);
      }
    }

    function startNewChat() {
      chatHistory = [];
      currentConversationId = null;
      isNewConversation = true;
      document.getElementById('messagesContainer').innerHTML = '';
      document.getElementById('message').focus();
      loadConversations();
    }

    async function sendMessage(e){
      e.preventDefault();
      const c = document.getElementById('messagesContainer');
      const b = e.target.querySelector('button[type="submit"]');
      const t = document.getElementById('message');
      const m = t.value.trim();
      
      if(!m) return;
      t.value = '';
      b.disabled = true;
      if(c.innerHTML.includes('empty-state')){c.innerHTML='';}
      
      const u = document.createElement('div');
      u.className = 'message user';
      const ub = document.createElement('div');
      ub.className = 'bubble user';
      ub.textContent = m;
      u.appendChild(ub);
      c.appendChild(u);
      c.scrollTop = c.scrollHeight;
      
      const l = document.createElement('div');
      l.className = 'message';
      l.innerHTML = '<p class="loading">ACUBOT is thinking...</p>';
      c.appendChild(l);
      c.scrollTop = c.scrollHeight;

      try{
        const h = {'Content-Type':'application/json'};
        if(csrfToken) h['X-CSRFToken'] = csrfToken;
        
        const payload = { message: m, history: chatHistory, new_conversation: isNewConversation };

        const r = await fetch(`${apiBaseUrl}/ask/`, {
          method: 'POST',
          headers: h,
          body: JSON.stringify(payload),
          credentials: 'same-origin'
        });

        if(!r||!r.ok){
          throw new Error('Network response was not ok');
        }
        
        l.className = 'message assistant';
        l.innerHTML = '';
        const lb = document.createElement('div');
        lb.className = 'bubble assistant';
        l.appendChild(lb);
        c.scrollTop = c.scrollHeight;

        const reader = r.body.getReader();
        const decoder = new TextDecoder("utf-8");
        let botResponse = '';
        // NDJSON arrives in arbitrary network chunks — a single read() may
        // contain part of one JSON object, several whole ones, or end mid-
        // line. Buffer everything and only parse complete newline-delimited
        // pieces so chunk-boundary splits do not corrupt the stream.
        let buffer = '';

        while(true) {
            const {value, done} = await reader.read();
            if(done) {
                // Flush whatever is left in the buffer (final line without \n).
                if (buffer.trim()) {
                    try {
                        const parsed = JSON.parse(buffer);
                        if (parsed.type === "chunk") {
                            botResponse += parsed.text;
                        } else if (parsed.type === "done") {
                            botResponse = parsed.text;
                        }
                        lb.textContent = botResponse;
                    } catch(e) {
                        console.warn("Tail parse skipped:", e, buffer);
                    }
                }
                break;
            }
            buffer += decoder.decode(value, {stream: true});
            let nl;
            while ((nl = buffer.indexOf('\n')) !== -1) {
                const line = buffer.slice(0, nl);
                buffer = buffer.slice(nl + 1);
                if (line.trim() === '') continue;
                try {
                    const parsed = JSON.parse(line);
                    if (parsed.type === "chunk") {
                        botResponse += parsed.text;
                        lb.textContent = botResponse;
                        c.scrollTop = c.scrollHeight;
                    } else if (parsed.type === "done") {
                        botResponse = parsed.text;
                        lb.textContent = botResponse;
                        c.scrollTop = c.scrollHeight;
                    }
                } catch(e) {
                    console.warn("Parse skipped:", e, line);
                }
            }
        }
        
        chatHistory.push({ role: 'user', text: m });
        chatHistory.push({ role: 'assistant', text: botResponse });
        
        if (chatHistory.length > 50) {
            chatHistory = chatHistory.slice(-50);
        }

        isNewConversation = false;
        loadConversations();

      }catch(er){
        console.error('Error:',er);
        l.remove();
        const ed=document.createElement('div');
        ed.className='error';
        ed.textContent='Error: '+er.message;
        c.appendChild(ed);
      }
      b.disabled=false;
    }
    
    document.addEventListener('DOMContentLoaded',()=>{
      const textarea = document.getElementById('message');
      textarea.addEventListener('keydown', function(e) {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          document.querySelector('form.compose').dispatchEvent(new Event('submit', {cancelable: true, bubbles: true}));
        }
      });

      // Load conversations when page loads
      loadConversations();
    });
  </script>
</body>
</html>
