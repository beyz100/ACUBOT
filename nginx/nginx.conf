upstream acubot_web {
    server web:8000;
}

server {
    listen 80;

    # Streaming endpoint — Django sends a chunked NDJSON stream from
    # `chat_with_acubot`. Without these flags Nginx buffers the whole
    # response and the chat UI can't render tokens as they arrive,
    # which breaks the sidebar refresh that runs after the stream finishes.
    location /api/chat/ask/ {
        proxy_pass http://acubot_web;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_redirect off;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        chunked_transfer_encoding on;
    }

    location / {
        proxy_pass http://acubot_web;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_redirect off;
    }

    location /static/ {
        alias /app/static/;
    }
}
